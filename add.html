<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Agregar datos</title>
</head>

<body>

  <!-- Enlace para volver al listado principal -->
  <a href="index.php">Inicio</a>
  <br><br>

  <!--
		Formulario HTML
		- action="add.php" → archivo PHP que procesará los datos
		- method="post"   → los datos se envían de forma segura (no visible en la URL)
	-->
  <form action="add.php" method="post" name="form1">

    <table width="25%" border="0">

      <tr>
        <td>Nombre</td>
        <td>
          <input type="text" name="name">
        </td>
      </tr>

      <tr>
        <td>Edad</td>
        <td>
          <input type="number" name="age">
        </td>
      </tr>

      <tr>
        <td>Email</td>
        <td>
          <input type="email" name="email">
        </td>
      </tr>

      <tr>
        <td></td>
        <td>
          <!--
						name="Submit" es importante:
						add.php lo usa para verificar
						si el formulario fue enviado
					-->
          <input type="submit" name="Submit" value="Agregar">
        </td>
      </tr>

    </table>

  </form>

</body>

</html>
